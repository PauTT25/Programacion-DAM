<!doctype html>
<html>
  <head>
    <style>
      canvas{border:1px solid grey;}
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script>
      let lienzo = document.querySelector("canvas");
      let contexto = lienzo.getContext("2d");
      lienzo.width = 512;
      lienzo.height = 512;
      contexto.fillStyle = "red"
      contexto.fillRect(40,40,60,60); // x,y,w,h
      // Circulo
      	contexto.fillStyle = "green"		// Cambiamos el color de dentro
      	contexto.beginPath();						// Empezamos un nuevo dibujo
      	contexto.arc(150,150,50,0,Math.PI*2)// x,y,r,angulo _inicio,angulo_final
      	contexto.fill()		//Se rellen a el circulo con el color que hayamos dicho
    </script>
  </body>
</html>
