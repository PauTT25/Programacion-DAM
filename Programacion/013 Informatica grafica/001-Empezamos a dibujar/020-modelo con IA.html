<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<style>
*{box-sizing:border-box;font-family:Segoe UI}
body{
  margin:0;height:100vh;display:flex;
  background:linear-gradient(120deg,#eef2ff,#c7d2fe);
}

#panel{
  width:270px;background:#fff;padding:18px;
  box-shadow:4px 0 20px rgba(0,0,0,.15)
}

h2{text-align:center;margin-top:0}

button{
  width:100%;margin-bottom:6px;padding:8px;
  border:none;border-radius:6px;
  background:#e5e7eb;cursor:pointer
}
button.active{background:#6366f1;color:white}

label{font-size:13px;color:#555}

canvas{
  background:white;border-radius:14px;
  box-shadow:0 12px 25px rgba(0,0,0,.25)
}

#workspace{
  flex:1;display:flex;
  justify-content:center;align-items:center
}
</style>
</head>

<body>

<div id="panel">
<h2>Herramientas</h2>

<label>Dibujo</label>
<button data-tool="pencil" class="active">✏️ Lápiz</button>
<button data-tool="brush">🖌️ Pincel</button>
<button data-tool="pen">🖋️ Pluma</button>
<button data-tool="spray">🎨 Brocha</button>
<button data-tool="eraser">🧽 Goma</button>

<label>Formas</label>
<button data-tool="line">📏 Línea</button>
<button data-tool="rect">⬛ Rectángulo</button>
<button data-tool="circle">⚪ Círculo</button>
<button data-tool="triangle">🔺 Triángulo</button>
<button data-tool="star">⭐ Estrella</button>
<button data-tool="arrow">➡️ Flecha</button>
<button data-tool="hex">⬡ Hexágono</button>

<label>Color</label>
<input type="color" id="color">

<label>Grosor</label>
<input type="range" id="size" min="1" max="40" value="6">

<button id="clear">🗑️ Limpiar</button>
</div>

<div id="workspace">
<canvas id="canvas" width="620" height="620"></canvas>
</div>

<script>
const canvas = document.getElementById("canvas")
const ctx = canvas.getContext("2d")
const color = document.getElementById("color")
const size = document.getElementById("size")
const buttons = document.querySelectorAll("button[data-tool]")
let tool="pencil", drawing=false
let startX=0,startY=0,lastX=0,lastY=0

buttons.forEach(b=>{
  b.onclick=()=>{
    buttons.forEach(x=>x.classList.remove("active"))
    b.classList.add("active")
    tool=b.dataset.tool
  }
})

canvas.onmousedown=e=>{
  drawing=true
  startX=lastX=e.offsetX
  startY=lastY=e.offsetY
  ctx.beginPath()
}

canvas.onmousemove=e=>{
  if(!drawing) return
  const x=e.offsetX,y=e.offsetY
  ctx.strokeStyle=color.value
  ctx.fillStyle=color.value
  ctx.globalAlpha=1
  ctx.shadowBlur=0
  ctx.globalCompositeOperation="source-over"

  /* LÁPIZ */
  if(tool==="pencil"){
    ctx.lineWidth=size.value
    ctx.lineCap="butt"
    ctx.moveTo(lastX,lastY)
    ctx.lineTo(x,y)
    ctx.stroke()
  }

  /* PINCEL SUAVE */
  if(tool==="brush"){
    ctx.lineWidth=size.value*1.4
    ctx.lineCap="round"
    ctx.globalAlpha=0.6
    ctx.shadowBlur=10
    ctx.shadowColor=color.value
    ctx.moveTo(lastX,lastY)
    ctx.lineTo(x,y)
    ctx.stroke()
  }

  /* PLUMA (presión simulada) */
  if(tool==="pen"){
    const speed=Math.hypot(x-lastX,y-lastY)
    ctx.lineWidth=Math.max(1,size.value-(speed/5))
    ctx.lineCap="round"
    ctx.moveTo(lastX,lastY)
    ctx.lineTo(x,y)
    ctx.stroke()
  }

  /* BROCHA (spray) */
  if(tool==="spray"){
    for(let i=0;i<15;i++){
      const a=Math.random()*Math.PI*2
      const r=Math.random()*size.value
      ctx.fillRect(x+Math.cos(a)*r,y+Math.sin(a)*r,1.5,1.5)
    }
  }

  /* GOMA */
  if(tool==="eraser"){
    ctx.globalCompositeOperation="destination-out"
    ctx.lineWidth=size.value*1.5
    ctx.lineCap="round"
    ctx.moveTo(lastX,lastY)
    ctx.lineTo(x,y)
    ctx.stroke()
  }

  lastX=x;lastY=y
}

canvas.onmouseup=e=>{
  drawing=false
  const x=e.offsetX,y=e.offsetY

  if(tool==="line"){
    ctx.beginPath()
    ctx.moveTo(startX,startY)
    ctx.lineTo(x,y)
    ctx.stroke()
  }

  if(tool==="rect"){
    ctx.strokeRect(startX,startY,x-startX,y-startY)
  }

  if(tool==="circle"){
    const r=Math.hypot(x-startX,y-startY)
    ctx.beginPath()
    ctx.arc(startX,startY,r,0,Math.PI*2)
    ctx.stroke()
  }

  if(tool==="triangle"){
    ctx.beginPath()
    ctx.moveTo(startX,startY)
    ctx.lineTo(x,y)
    ctx.lineTo(startX,y)
    ctx.closePath()
    ctx.stroke()
  }

  if(tool==="star"){
    const r=Math.hypot(x-startX,y-startY)
    ctx.beginPath()
    for(let i=0;i<10;i++){
      const a=i*Math.PI/5
      const rad=i%2?r:r/2
      ctx.lineTo(startX+Math.cos(a)*rad,startY+Math.sin(a)*rad)
    }
    ctx.closePath()
    ctx.stroke()
  }

  if(tool==="arrow"){
    ctx.beginPath()
    ctx.moveTo(startX,startY)
    ctx.lineTo(x,y)
    ctx.lineTo(x-10,y-10)
    ctx.moveTo(x,y)
    ctx.lineTo(x-10,y+10)
    ctx.stroke()
  }

  if(tool==="hex"){
    const r=Math.hypot(x-startX,y-startY)
    ctx.beginPath()
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3
      ctx.lineTo(startX+Math.cos(a)*r,startY+Math.sin(a)*r)
    }
    ctx.closePath()
    ctx.stroke()
  }
}

document.getElementById("clear").onclick=()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height)
}
</script>

</body>
</html>
