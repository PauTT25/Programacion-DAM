<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Village (Canvas)</title>
<style>
  html,body{margin:0;padding:0;background:#111}
  canvas{display:block;margin:16px auto;background:#3a7d44;border:2px solid #2b2b2b}
</style>
</head>
<body>
<canvas></canvas>

<script>
const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d");

const W = 512, H = 512;
canvas.width = W;
canvas.height = H;

const NUM_NPCS = 35;
const MAX_SPEED = 1.4;
const BORDER_BOUNCE = 0.9;
const SEPARATION_RADIUS = 16;
const SEPARATION_FORCE = 0.07;
const ANGLE_JITTER = 0.07;

const village = {
  houses: [
    {x:80,y:80,w:60,h:50},
    {x:200,y:70,w:70,h:55},
    {x:340,y:90,w:60,h:50},
    {x:100,y:300,w:70,h:55},
    {x:300,y:320,w:80,h:60}
  ],
  paths: [
    {x:0,y:240,w:512,h:36},
    {x:240,y:0,w:36,h:512}
  ],
  plaza:{x:256,y:256,r:42}
};

for (const npc of npcs) {
  npc.x += npc.vx;
  npc.y += npc.vy;

  // izquierda
  if (npc.x < npc.radio) {
    npc.x = npc.radio;
    npc.vx = Math.abs(npc.vx);
    npc.angle = Math.atan2(npc.vy, npc.vx);
  }

  // derecha
  if (npc.x > W - npc.radio) {
    npc.x = W - npc.radio;
    npc.vx = -Math.abs(npc.vx);
    npc.angle = Math.atan2(npc.vy, npc.vx);
  }

  // arriba
  if (npc.y < npc.radio) {
    npc.y = npc.radio;
    npc.vy = Math.abs(npc.vy);
    npc.angle = Math.atan2(npc.vy, npc.vx);
  }

  // abajo
  if (npc.y > H - npc.radio) {
    npc.y = H - npc.radio;
    npc.vy = -Math.abs(npc.vy);
    npc.angle = Math.atan2(npc.vy, npc.vx);
  }
}


class Npc{
  constructor(){
    this.x=Math.random()*W;
    this.y=Math.random()*H;
    this.r=6+Math.random()*4;
    this.angle=Math.random()*Math.PI*2;
    this.speed=0.5+Math.random();
    this.vx=Math.cos(this.angle)*this.speed;
    this.vy=Math.sin(this.angle)*this.speed;
    this.color=[180+Math.random()*50,160+Math.random()*40,120];
  }
}

let npcs=[];
for(let i=0;i<NUM_NPCS;i++) npcs.push(new Npc());

function update(){
  for(let i=0;i<npcs.length;i++){
    const a=npcs[i];
    let px=0,py=0;

    for(let j=0;j<npcs.length;j++){
      if(i===j)continue;
      const b=npcs[j];
      const dx=a.x-b.x, dy=a.y-b.y;
      const d2=dx*dx+dy*dy;
      const md=(a.r+b.r+SEPARATION_RADIUS)**2;
      if(d2>0&&d2<md){
        const d=Math.sqrt(d2);
        px+=dx/d;
        py+=dy/d;
      }
    }

    a.angle+=(Math.random()-0.5)*ANGLE_JITTER;
    a.vx=Math.cos(a.angle)*a.speed+px*SEPARATION_FORCE;
    a.vy=Math.sin(a.angle)*a.speed+py*SEPARATION_FORCE;

    const sp=Math.hypot(a.vx,a.vy);
    if(sp>MAX_SPEED){
      a.vx=a.vx/sp*MAX_SPEED;
      a.vy=a.vy/sp*MAX_SPEED;
    }
  }

  for(const n of npcs){
    n.x+=n.vx;
    n.y+=n.vy;

    if(n.x<n.r||n.x>W-n.r){n.vx*=-BORDER_BOUNCE}
    if(n.y<n.r||n.y>H-n.r){n.vy*=-BORDER_BOUNCE}
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // grass
  ctx.fillStyle="#3a7d44";
  ctx.fillRect(0,0,W,H);

  // paths
  ctx.fillStyle="#b89b6a";
  village.paths.forEach(p=>ctx.fillRect(p.x,p.y,p.w,p.h));

  // plaza
  ctx.beginPath();
  ctx.fillStyle="#c9b18f";
  ctx.arc(village.plaza.x,village.plaza.y,village.plaza.r,0,Math.PI*2);
  ctx.fill();

  // houses
  village.houses.forEach(h=>{
    ctx.fillStyle="#8b5a2b";
    ctx.fillRect(h.x,h.y,h.w,h.h);

    ctx.fillStyle="#5a2e12";
    ctx.beginPath();
    ctx.moveTo(h.x,h.y);
    ctx.lineTo(h.x+h.w/2,h.y-20);
    ctx.lineTo(h.x+h.w,h.y);
    ctx.fill();
  });

  // villagers
  for(const n of npcs){
    ctx.fillStyle=`rgb(${n.color[0]},${n.color[1]},${n.color[2]})`;
    ctx.beginPath();
    ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="rgba(0,0,0,.35)";
    ctx.beginPath();
    ctx.moveTo(n.x,n.y);
    ctx.lineTo(n.x+Math.cos(n.angle)*(n.r+5),n.y+Math.sin(n.angle)*(n.r+5));
    ctx.stroke();
  }

  // border
  ctx.strokeStyle="#d6b98c";
  ctx.lineWidth=6;
  ctx.strokeRect(3,3,W-6,H-6);
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
